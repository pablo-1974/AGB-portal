{% extends "aula_informatica/base.html" %}

{% block content %}
  <div
    class="space-y-6 max-w-5xl"
    x-data="{
      mode: 'aula',
      aulaAula: '',
      aulaSesiones: [],
      loadingAula: false,
      aulaPuesto: '',
      puestoNum: '',
      puestoHistorial: [],
      loadingPuesto: false,
      setMode(next) {
        this.mode = next;
        this.aulaAula = '';
        this.aulaSesiones = [];
        this.aulaPuesto = '';
        this.puestoNum = '';
        this.puestoHistorial = [];
      },
      async loadAulaSesiones() {
        if (!this.aulaAula) {
          this.aulaSesiones = [];
          return;
        }
        this.loadingAula = true;
        try {
          const params = new URLSearchParams({ aula: this.aulaAula });
          const res = await fetch(
            '/aula-informatica/rastrear/aula-sesiones?' + params.toString(),
            { credentials: 'same-origin' }
          );
          if (!res.ok) throw new Error('fetch');
          this.aulaSesiones = await res.json();
        } catch (e) {
          this.aulaSesiones = [];
        } finally {
          this.loadingAula = false;
        }
      },
      onPuestoFiltersChange() {
        if (!this.aulaPuesto || !this.puestoNum) {
          this.puestoHistorial = [];
          return;
        }
        this.loadPuestoHistorial();
      },
      async loadPuestoHistorial() {
        if (!this.aulaPuesto || !this.puestoNum) {
          this.puestoHistorial = [];
          return;
        }
        this.loadingPuesto = true;
        try {
          const params = new URLSearchParams({
            aula: this.aulaPuesto,
            puesto: this.puestoNum,
          });
          const res = await fetch(
            '/aula-informatica/rastrear/puesto-historial?' + params.toString(),
            { credentials: 'same-origin' }
          );
          if (!res.ok) throw new Error('fetch');
          this.puestoHistorial = await res.json();
        } catch (e) {
          this.puestoHistorial = [];
        } finally {
          this.loadingPuesto = false;
        }
      }
    }"
  >
    <div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Rastrear</h1>
      <p class="text-sm text-gray-600 mt-1">
        Consulta de sesiones por aula o historial de uso de cada puesto.
      </p>
    </div>

    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        class="rounded-lg px-4 py-2 text-sm font-semibold border-2 transition"
        :class="mode === 'aula'
          ? 'border-teal-600 bg-teal-50 text-teal-900'
          : 'border-gray-200 bg-white text-gray-700 hover:bg-gray-50'"
        @click="setMode('aula')"
      >
        Rastrear Aula
      </button>
      <button
        type="button"
        class="rounded-lg px-4 py-2 text-sm font-semibold border-2 transition"
        :class="mode === 'puesto'
          ? 'border-teal-600 bg-teal-50 text-teal-900'
          : 'border-gray-200 bg-white text-gray-700 hover:bg-gray-50'"
        @click="setMode('puesto')"
      >
        Rastrear Puesto
      </button>
    </div>

  <div x-show="mode === 'aula'" x-cloak class="space-y-4">
    <section class="card space-y-3">
      <div class="max-w-md">
        <label class="label" for="rastrear_aula_select">Aula</label>
        <select
          id="rastrear_aula_select"
          class="input text-sm"
          x-model="aulaAula"
          @change="loadAulaSesiones()"
        >
          <option value="">—</option>
          {% for aula in aulas %}
          <option value="{{ aula.id }}">{{ aula.label }}</option>
          {% endfor %}
        </select>
      </div>
    </section>

    <p class="text-sm text-gray-500" x-show="loadingAula">Cargando…</p>

    <section class="card overflow-hidden" x-show="aulaAula && !loadingAula">
      <template x-if="aulaSesiones.length">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-100 text-gray-700">
              <tr>
                <th class="text-left py-2 px-3 font-semibold">Fecha</th>
                <th class="text-left py-2 px-3 font-semibold w-20">Hora</th>
                <th class="text-left py-2 px-3 font-semibold">Profesor</th>
                <th class="text-left py-2 px-3 font-semibold">Grupo</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, idx) in aulaSesiones" :key="idx">
                <tr class="border-t border-gray-100 hover:bg-gray-50/80">
                  <td class="py-2 px-3 text-gray-900" x-text="row.session_date_display"></td>
                  <td class="py-2 px-3 text-gray-800" x-text="row.class_hour"></td>
                  <td class="py-2 px-3 text-gray-800" x-text="row.user_name"></td>
                  <td class="py-2 px-3 text-gray-700" x-text="row.grupos_display"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
      <p class="text-sm text-gray-600" x-show="!aulaSesiones.length">
        No hay sesiones registradas para esta aula.
      </p>
    </section>
  </div>

  <div x-show="mode === 'puesto'" x-cloak class="space-y-4">
    <section class="card flex flex-wrap gap-4 items-end">
      <div class="min-w-[12rem]">
        <label class="label" for="rastrear_puesto_aula">Aula</label>
        <select
          id="rastrear_puesto_aula"
          class="input text-sm"
          x-model="aulaPuesto"
          @change="onPuestoFiltersChange()"
        >
          <option value="">—</option>
          {% for aula in aulas %}
          <option value="{{ aula.id }}">{{ aula.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="min-w-[8rem]">
        <label class="label" for="rastrear_puesto_num">Puesto</label>
        <select
          id="rastrear_puesto_num"
          class="input text-sm"
          x-model="puestoNum"
          @change="onPuestoFiltersChange()"
        >
          <option value="">—</option>
          {% for puesto in range(1, num_puestos + 1) %}
          <option value="{{ puesto }}">{{ puesto }}</option>
          {% endfor %}
        </select>
      </div>
    </section>

    <p class="text-sm text-gray-500" x-show="loadingPuesto">Cargando…</p>

    <section
      class="card overflow-hidden"
      x-show="aulaPuesto && puestoNum && !loadingPuesto"
    >
      <template x-if="puestoHistorial.length">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-100 text-gray-700">
              <tr>
                <th class="text-left py-2 px-3 font-semibold">Fecha</th>
                <th class="text-left py-2 px-3 font-semibold w-20">Hora</th>
                <th class="text-left py-2 px-3 font-semibold">Profesor</th>
                <th class="text-left py-2 px-3 font-semibold">Alumno</th>
                <th class="text-left py-2 px-3 font-semibold">Grupo</th>
                <th class="text-left py-2 px-3 font-semibold w-28">Estado</th>
                <th class="text-left py-2 px-3 font-semibold">Incidencia</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, idx) in puestoHistorial" :key="idx">
                <tr class="border-t border-gray-100 hover:bg-gray-50/80">
                  <td class="py-2 px-3 text-gray-900" x-text="row.session_date_display"></td>
                  <td class="py-2 px-3 text-gray-800" x-text="row.class_hour"></td>
                  <td class="py-2 px-3 text-gray-800" x-text="row.user_name"></td>
                  <td class="py-2 px-3 text-gray-800" x-text="row.alumno"></td>
                  <td class="py-2 px-3 text-gray-700" x-text="row.grupo"></td>
                  <td class="py-2 px-3 text-gray-700" x-text="row.estado_label"></td>
                  <td class="py-2 px-3 text-gray-700" x-text="row.incidencia"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
      <p class="text-sm text-gray-600" x-show="!puestoHistorial.length">
        No hay registros de uso para este puesto en esta aula.
      </p>
    </section>
  </div>
  </div>
{% endblock %}
