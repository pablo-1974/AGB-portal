{% extends "funcionamiento_portal/base.html" %}
{% block content %}
<div class="space-y-6 max-w-3xl">
  <div>
    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Enviar mensaje</h1>
    <p class="text-sm text-gray-600 mt-2">Elija el tipo de mensaje:</p>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    {% for t in tipos %}
    <a href="{{ t.href }}" class="card hover:bg-amber-50/50 border-2 border-amber-300 hover:border-amber-400 transition block">
      <div class="font-semibold text-gray-900">{{ t.title }}</div>
      <p class="text-xs text-amber-800 font-medium mt-3">Redactar mensaje →</p>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
