services:
  - type: web
    name: campus-portal
    runtime: python
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_INCIDENCIAS_URL
        sync: false
      - key: APP_RESERVAS_URL
        sync: false
      - key: APP_MOSCOSOS_URL
        sync: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
