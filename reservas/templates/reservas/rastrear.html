{% extends "reservas/base.html" %}

{% block content %}
  <div
    class="space-y-6 max-w-6xl"
    x-data="{
      mode: 'aula',
      roomAula: '',
      aulaReservas: [],
      loadingAula: false,
      profesorId: '',
      profesorReservas: [],
      loadingProfesor: false,
      setMode(next) {
        this.mode = next;
        this.roomAula = '';
        this.aulaReservas = [];
        this.profesorId = '';
        this.profesorReservas = [];
      },
      async loadAulaReservas() {
        if (!this.roomAula) {
          this.aulaReservas = [];
          return;
        }
        this.loadingAula = true;
        try {
          const params = new URLSearchParams({ room: this.roomAula });
          const res = await fetch(
            '/reservas/rastrear/aula-reservas?' + params.toString(),
            { credentials: 'same-origin' }
          );
          if (!res.ok) throw new Error('fetch');
          this.aulaReservas = await res.json();
        } catch (e) {
          this.aulaReservas = [];
        } finally {
          this.loadingAula = false;
        }
      },
      async loadProfesorReservas() {
        if (!this.profesorId) {
          this.profesorReservas = [];
          return;
        }
        this.loadingProfesor = true;
        try {
          const params = new URLSearchParams({ profesor_id: this.profesorId });
          const res = await fetch(
            '/reservas/rastrear/profesor-reservas?' + params.toString(),
            { credentials: 'same-origin' }
          );
          if (!res.ok) throw new Error('fetch');
          this.profesorReservas = await res.json();
        } catch (e) {
          this.profesorReservas = [];
        } finally {
          this.loadingProfesor = false;
        }
      }
    }"
  >
    <div>
      <h1 class="text-xl font-semibold">🔍 Rastrear</h1>
      <p class="text-sm text-gray-600 mt-1">Consulta de historial de reservas puntuales.</p>
    </div>

    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        class="rounded-lg px-4 py-2 text-sm font-semibold border-2 transition"
        :class="mode === 'aula'
          ? 'border-teal-600 bg-teal-50 text-teal-900'
          : 'border-gray-200 bg-white text-gray-700 hover:bg-gray-50'"
        @click="setMode('aula')"
      >
        Rastrear Aula
      </button>
      <button
        type="button"
        class="rounded-lg px-4 py-2 text-sm font-semibold border-2 transition"
        :class="mode === 'profesor'
          ? 'border-teal-600 bg-teal-50 text-teal-900'
          : 'border-gray-200 bg-white text-gray-700 hover:bg-gray-50'"
        @click="setMode('profesor')"
      >
        Rastrear Profesor
      </button>
    </div>

    <div x-show="mode === 'aula'" x-cloak class="space-y-4">
      <section class="card space-y-3">
        <div class="max-w-md">
          <label class="label" for="rastrear_room">Aula</label>
          <select
            id="rastrear_room"
            class="input text-sm"
            x-model="roomAula"
            @change="loadAulaReservas()"
          >
            <option value="">—</option>
            {% for room in rooms %}
            <option value="{{ room }}">{{ room }}</option>
            {% endfor %}
          </select>
        </div>
      </section>

      <p class="text-sm text-gray-500" x-show="loadingAula">Cargando…</p>

      <section class="card overflow-hidden" x-show="roomAula && !loadingAula">
        <template x-if="aulaReservas.length">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-100 text-gray-700">
                <tr>
                  <th class="text-left py-2 px-3 font-semibold">Fecha</th>
                  <th class="text-left py-2 px-3 font-semibold w-20">Hora</th>
                  <th class="text-left py-2 px-3 font-semibold">Profesor</th>
                  <th class="text-left py-2 px-3 font-semibold">Grupo</th>
                  <th class="text-left py-2 px-3 font-semibold min-w-[10rem]">Relleno el estado de los equipos</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, idx) in aulaReservas" :key="idx">
                  <tr class="border-t border-gray-100 hover:bg-gray-50/80">
                    <td class="py-2 px-3 text-gray-900" x-text="row.fecha_display"></td>
                    <td class="py-2 px-3 text-gray-800" x-text="row.slot"></td>
                    <td class="py-2 px-3 text-gray-800" x-text="row.reserved_for_name"></td>
                    <td class="py-2 px-3 text-gray-700" x-text="row.grupo"></td>
                    <td
                      class="py-2 px-3 font-medium"
                      :class="row.relleno_estado === 'Sí' ? 'text-emerald-700' : (row.relleno_estado === 'No' ? 'text-red-700' : 'text-gray-500')"
                      x-text="row.relleno_estado"
                    ></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <p class="text-sm text-gray-600" x-show="!aulaReservas.length">
          No hay reservas puntuales para esta aula.
        </p>
      </section>
    </div>

    <div x-show="mode === 'profesor'" x-cloak class="space-y-4">
      <section class="card space-y-3">
        <div class="max-w-md">
          <label class="label" for="rastrear_profesor">Profesor</label>
          <select
            id="rastrear_profesor"
            class="input text-sm"
            x-model="profesorId"
            @change="loadProfesorReservas()"
          >
            <option value="">—</option>
            {% for t in teachers %}
            <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
          </select>
        </div>
      </section>

      <p class="text-sm text-gray-500" x-show="loadingProfesor">Cargando…</p>

      <section class="card overflow-hidden" x-show="profesorId && !loadingProfesor">
        <template x-if="profesorReservas.length">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-100 text-gray-700">
                <tr>
                  <th class="text-left py-2 px-3 font-semibold">Fecha</th>
                  <th class="text-left py-2 px-3 font-semibold w-20">Hora</th>
                  <th class="text-left py-2 px-3 font-semibold">Aula</th>
                  <th class="text-left py-2 px-3 font-semibold w-28">Rellenó Estado</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, idx) in profesorReservas" :key="idx">
                  <tr class="border-t border-gray-100 hover:bg-gray-50/80">
                    <td class="py-2 px-3 text-gray-900" x-text="row.fecha_display"></td>
                    <td class="py-2 px-3 text-gray-800" x-text="row.slot"></td>
                    <td class="py-2 px-3 text-gray-800" x-text="row.room"></td>
                    <td
                      class="py-2 px-3 font-medium"
                      :class="row.relleno_estado === 'Sí' ? 'text-emerald-700' : (row.relleno_estado === 'No' ? 'text-red-700' : 'text-gray-500')"
                      x-text="row.relleno_estado"
                    ></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <p class="text-sm text-gray-600" x-show="!profesorReservas.length">
          No hay reservas puntuales para este profesor.
        </p>
      </section>
    </div>
  </div>
{% endblock %}
